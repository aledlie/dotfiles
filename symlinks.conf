# Dotfile symlink manifest — single source of truth for install.sh and the Makefile.
# Each row maps a repo-relative source file to the $HOME target it is linked to.
# Lines starting with # and blank lines are ignored. Columns are whitespace-separated.
#
# repo source            $HOME target
shell/zsh/zshenv         .zshenv
shell/zsh/zshrc          .zshrc
shell/zsh/zprofile       .zprofile
shell/bash/bashrc        .bashrc
shell/bash/bash_profile  .bash_profile
shell/dircolors          .dircolors
git/gitconfig            .gitconfig
vim/vimrc                .vimrc
vim/vim                  .vim
tmux/tmux.conf           .tmux.conf
